services:
  pdf-presenter:
    build: .
    container_name: pdf-presenter
    init: true # forwards SIGTERM so the server shuts down gracefully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # SESSION_TTL: 4        # idle hours before a presenter-less session is removed
      # MAX_FILE_SIZE: 100    # MB
      # TRUST_PROXY: 1        # uncomment when running behind a reverse proxy
    volumes:
      # The like counter survives rebuilds. Uploaded PDFs are temporary by
      # design (deleted when sessions end), so they need no volume.
      - pdf-presenter-data:/app/data
    restart: unless-stopped

volumes:
  pdf-presenter-data:
