<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Session - PDF Presenter</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <script type="module" src="/js/access.js"></script>
  </head>
  <body class="access-page">
    <div class="access-container">
      <div class="access-card">
        <div class="setup-logo" style="margin: 0 auto 20px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z"/></svg></div>
        <h1>Access Session</h1>
        <p>
          Select an active presentation session to join as a viewer.
          Remote control access requires the presenter's QR code.
        </p>

        <a href="/index.html" class="btn btn-primary" style="width: 100%; margin-bottom: 20px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><path d="M12 5v14M5 12h14"/></svg>
          Create New Session
        </a>

        <div class="search-wrapper">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" id="sessionSearch" class="search-input" placeholder="Search sessions by name…" aria-label="Search sessions" />
        </div>

        <div class="filter-row">
          <label for="sortSelect">Sort:</label>
          <select id="sortSelect" class="sort-select">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">By name</option>
          </select>
          <label for="timeFilter">Time:</label>
          <select id="timeFilter" class="time-filter-select">
            <option value="all">All time</option>
            <option value="1h">Last hour</option>
            <option value="4h">Last 4 hours</option>
            <option value="24h">Last 24 hours</option>
          </select>
        </div>

        <div id="sessionList" class="session-list" aria-live="polite">
          <div class="no-sessions">Loading active sessions...</div>
        </div>

        <button type="button" class="refresh-btn" id="refreshBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px;"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Refresh List
        </button>
      </div>
    </div>

  </body>
</html>
